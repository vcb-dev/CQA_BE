name: Deploy Railway

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      service:
        description: 'Redeploy service (api | worker | both)'
        required: true
        default: both
        type: choice
        options: [api, worker, both]
      skip_docker_push:
        description: 'Chỉ redeploy Railway (không build/push Docker)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-railway-production
  cancel-in-progress: false

env:
  IMAGE: viejhaf/cqa-be:latest

jobs:
  migrate:
    name: Prisma migrate deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional — nếu không có thì derive từ DATABASE_URL
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Thiếu GitHub secret DATABASE_URL"
            exit 1
          fi
          if [ -z "$DIRECT_URL" ]; then
            # Schema Prisma cần DIRECT_URL; fallback từ pooler URL (6543 → 5432)
            export DIRECT_URL="$(node -e '
              const u = process.env.DATABASE_URL;
              try {
                const x = new URL(u);
                if (x.port === "6543") x.port = "5432";
                x.searchParams.delete("pgbouncer");
                x.searchParams.delete("connection_limit");
                process.stdout.write(x.toString());
              } catch {
                process.stdout.write(u);
              }
            ')"
            echo "DIRECT_URL không có secret — dùng bản derive từ DATABASE_URL"
          fi
          # DB đã có bảng → chỉ đánh dấu migration cũ, không chạy lại SQL
          node scripts/ensure-migration-baseline.js
          npx prisma migrate deploy

  build-and-push:
    name: Build & Push Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [migrate]
    if: |
      always() &&
      needs.migrate.result == 'success' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_docker_push != 'true'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  redeploy:
    name: Redeploy Railway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [migrate, build-and-push]
    if: |
      always() &&
      needs.migrate.result == 'success' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_API: ${{ secrets.RAILWAY_SERVICE_API }}
      RAILWAY_SERVICE_WORKER: ${{ secrets.RAILWAY_SERVICE_WORKER }}

    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Validate Railway secrets
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Thiếu secret RAILWAY_TOKEN"
            exit 1
          fi
          echo "RAILWAY_TOKEN OK"

      - name: Resolve targets
        id: targets
        run: |
          MODE="${{ github.event.inputs.service || 'both' }}"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Redeploy mode: $MODE"

      - name: Redeploy API
        if: steps.targets.outputs.mode == 'api' || steps.targets.outputs.mode == 'both'
        run: |
          if [ -z "$RAILWAY_SERVICE_API" ]; then
            echo "::error::Thiếu secret RAILWAY_SERVICE_API"
            exit 1
          fi
          echo "Redeploy API → $RAILWAY_SERVICE_API"
          railway redeploy --service "$RAILWAY_SERVICE_API" --yes

      - name: Redeploy Worker
        if: steps.targets.outputs.mode == 'worker' || steps.targets.outputs.mode == 'both'
        run: |
          if [ -z "$RAILWAY_SERVICE_WORKER" ]; then
            echo "::warning::Thiếu RAILWAY_SERVICE_WORKER — bỏ qua worker"
            exit 0
          fi
          echo "Redeploy Worker → $RAILWAY_SERVICE_WORKER"
          railway redeploy --service "$RAILWAY_SERVICE_WORKER" --yes
