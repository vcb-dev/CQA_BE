version: '3.8'

services:
  # AI Service Container
  cqa-ai:
    image: viejhaf/cqa-ai:latest
    container_name: cqa-ai
    ports:
      - "8080:8080"
    env_file:
      - .env.ai
    restart: unless-stopped

  # API — HTTP webhook nhận request, SSE inbox, cron xếp hàng job nền
  cqa-be:
    image: viejhaf/cqa-be:latest
    container_name: cqa-be
    ports:
      - "3000:3000"
    env_file:
      - .env.be
    environment:
      - CSKH_RUN_MODE=api
    restart: unless-stopped
    depends_on:
      - cqa-ai

  # Worker — xử lý tin webhook, quét đầy đủ, audit AI (tách khỏi API để inbox không lag)
  cqa-worker:
    image: viejhaf/cqa-be:latest
    container_name: cqa-worker
    command: node dist/worker.js
    env_file:
      - .env.be
    environment:
      - CSKH_RUN_MODE=worker
    restart: unless-stopped
    depends_on:
      - cqa-be
