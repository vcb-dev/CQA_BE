# Cấu hình build/deploy mặc định cho service API trên Railway.
# Worker dùng cùng Dockerfile nhưng Start Command override trong Railway Dashboard:
#   node dist/worker.js
# và biến môi trường CSKH_RUN_MODE=worker

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Healthcheck chỉ bật trên service API trong Railway Dashboard:
#   Path = /api/v1/health
# Worker không expose HTTP — đừng gắn healthcheck HTTP cho worker.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
